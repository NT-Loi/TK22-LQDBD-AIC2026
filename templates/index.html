<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Retrieval - Temporal Search</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

  <div class="top-control-panel">
    <div class="left-panel">
      <form id="search-form" class="compact-form">
        <!-- Container chứa các dòng input động -->
        <div id="query-inputs-container">
          <!-- Dòng 1 (Mặc định) -->
          <div class="search-row query-row" data-index="0">
            <input type="text" name="description_0" class="main-query-input"
              placeholder="Event 1 (e.g. Woman in purple)..." autocomplete="off">
            <!-- Nút xóa sẽ được JS thêm vào nếu có nhiều hơn 1 dòng -->
          </div>
        </div>

        <div class="search-actions" style="margin-top: 5px; display: flex; gap: 10px;">
          <button type="button" id="add-query-btn" style="background: #28a745;">+ Add Next Event</button>
          <button type="submit" id="search-btn">Search Sequence</button>
          <button type="button" id="toggle-filters-btn">▼ Filters</button>
          <button type="button" id="toggle-group-shots-btn" class="toggle-btn-off">Group Shots: OFF</button>
        </div>

        <div id="advanced-filters" class="hidden compact-filters">
          <div class="filter-row">
            <label style="font-size: 12px; font-weight: bold;">Model(s):</label>
            <select id="models-select" multiple size="3" style="min-width: 150px; padding: 4px; border-radius: 4px; border: 1px solid #ced4da;">
              <option value="all" selected>All</option>
            </select>
          </div>

          <div class="filter-row">
            <label style="font-size: 12px; font-weight: bold;">Score Threshold:</label>
            <input type="number" id="score-threshold" value="0.3" step="0.05" min="0" max="1" style="width: 80px; padding: 4px; border-radius: 4px; border: 1px solid #ced4da;">
          </div>
          <div class="filter-row">
            <label style="font-size: 12px; font-weight: bold;">Result Limit:</label>
            <input type="number" id="result-limit" value="100" min="1" max="10000" style="width: 80px; padding: 4px; border-radius: 4px; border: 1px solid #ced4da;">
          </div>
          <div class="filter-row object-controls">
            <select id="object-select" style="min-width: 140px; padding: 4px; border-radius: 4px; border: 1px solid #ced4da;">
              <option value="person" selected>person</option>
              <option value="airplane">airplane</option>
              <option value="asparagus">asparagus</option>
              <option value="bag">bag</option>
              <option value="banana">banana</option>
              <option value="basket">basket</option>
              <option value="beetle">beetle</option>
              <option value="bench">bench</option>
              <option value="bicycle">bicycle</option>
              <option value="bird">bird</option>
              <option value="boat">boat</option>
              <option value="book">book</option>
              <option value="bookshelf">bookshelf</option>
              <option value="bowl">bowl</option>
              <option value="box">box</option>
              <option value="bracelet">bracelet</option>
              <option value="bridge">bridge</option>
              <option value="building">building</option>
              <option value="bus">bus</option>
              <option value="camera">camera</option>
              <option value="candle">candle</option>
              <option value="canoe">canoe</option>
              <option value="canvas">canvas</option>
              <option value="car">car</option>
              <option value="carpet">carpet</option>
              <option value="cat">cat</option>
              <option value="chair">chair</option>
              <option value="chili pepper">chili pepper</option>
              <option value="column">column</option>
              <option value="compact disc">compact disc</option>
              <option value="computer">computer</option>
              <option value="cow">cow</option>
              <option value="crab">crab</option>
              <option value="cup">cup</option>
              <option value="document">document</option>
              <option value="dog">dog</option>
              <option value="door">door</option>
              <option value="dress">dress</option>
              <option value="drum">drum</option>
              <option value="durian">durian</option>
              <option value="fence">fence</option>
              <option value="fire extinguisher">fire extinguisher</option>
              <option value="fish">fish</option>
              <option value="flashlight">flashlight</option>
              <option value="flower">flower</option>
              <option value="fountain">fountain</option>
              <option value="gate">gate</option>
              <option value="glasses">glasses</option>
              <option value="goat">goat</option>
              <option value="grape">grape</option>
              <option value="hat">hat</option>
              <option value="helmet">helmet</option>
              <option value="horse">horse</option>
              <option value="house">house</option>
              <option value="knife">knife</option>
              <option value="lantern">lantern</option>
              <option value="life jacket">life jacket</option>
              <option value="map">map</option>
              <option value="mat">mat</option>
              <option value="meat">meat</option>
              <option value="metal nail">metal nail</option>
              <option value="metal sheet">metal sheet</option>
              <option value="motorcycle">motorcycle</option>
              <option value="mushroom">mushroom</option>
              <option value="necklace">necklace</option>
              <option value="octopus">octopus</option>
              <option value="oven">oven</option>
              <option value="pan">pan</option>
              <option value="pancake">pancake</option>
              <option value="pants">pants</option>
              <option value="phone">phone</option>
              <option value="picture frame">picture frame</option>
              <option value="pineapple">pineapple</option>
              <option value="plate">plate</option>
              <option value="pomelo">pomelo</option>
              <option value="pot">pot</option>
              <option value="potato chips">potato chips</option>
              <option value="raincoat">raincoat</option>
              <option value="robot">robot</option>
              <option value="roller skates">roller skates</option>
              <option value="sack">sack</option>
              <option value="sandals">sandals</option>
              <option value="scarf">scarf</option>
              <option value="screen">screen</option>
              <option value="shark">shark</option>
              <option value="shirt">shirt</option>
              <option value="shoes">shoes</option>
              <option value="shrimp">shrimp</option>
              <option value="skateboard">skateboard</option>
              <option value="skyscraper">skyscraper</option>
              <option value="slippers">slippers</option>
              <option value="spoon">spoon</option>
              <option value="spring roll">spring roll</option>
              <option value="squid">squid</option>
              <option value="stage">stage</option>
              <option value="stove">stove</option>
              <option value="strawberry">strawberry</option>
              <option value="sword">sword</option>
              <option value="table">table</option>
              <option value="tarp">tarp</option>
              <option value="tie">tie</option>
              <option value="tiger">tiger</option>
              <option value="tofu">tofu</option>
              <option value="tomato">tomato</option>
              <option value="traffic light">traffic light</option>
              <option value="traffic sign">traffic sign</option>
              <option value="tray">tray</option>
              <option value="tree">tree</option>
              <option value="truck">truck</option>
              <option value="turtle">turtle</option>
              <option value="vegetable">vegetable</option>
              <option value="watch">watch</option>
            </select>
            <input type="number" id="object-confidence" value="0.7" step="0.1" max="1" placeholder="Conf">
            <input type="number" id="object-min" value="1" min="1" placeholder="Min">
            <input type="number" id="object-max" value="" max="10000" placeholder="Max">
            <button type="button" id="add-object-btn">+</button>
          </div>
          <div id="object-list"></div>
        </div>
      </form>
    </div>
    <div class="right-panel">
      <button id="login-btn"
        style="padding: 8px 15px; background: #e76f51; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Login
      </button>
    </div>
  </div>

  <main>
    <div id="results-container">
      <p class="placeholder" style="color:#777;">Enter hints in sequence to search.</p>
    </div>
  </main>

  <button id="scroll-top-btn" title="Press Space to scroll top">▲</button>

  <!-- Video Modal & Eval Modal giữ nguyên -->
  <div id="video-modal" class="modal-overlay hidden">
    <div class="modal-content-wrapper">
      <div class="modal-player-section">
        <button id="close-modal-btn" class="close-btn">&times;</button>
        <h3 id="modal-video-title">Loading...</h3>
        <div class="video-player-wrapper">
          <video id="modal-video-player" width="100%" controls autoplay></video>
        </div>
      </div>

      <div class="modal-sidebar">
        <h4>Keyframes in Shot</h4>
        <div id="modal-shot-list" class="shot-list-container">
        </div>
      </div>
    </div>
  </div>

  <div id="evaluation-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 500px;">
      <h3>Select Evaluation</h3>
      <div id="evaluation-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
      <div style="text-align: right;">
        <button id="cancel-eval-btn"
          style="padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', path='js/main.js') }}"></script>
</body>

</html>
