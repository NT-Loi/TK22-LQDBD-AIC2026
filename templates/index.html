<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Retrieval - AIC 2026</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
  <div class="app-layout">

    <!-- ═══ LEFT SIDEBAR — All Query Controls ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-title">AIC 2026</h1>
        <button id="login-btn" class="login-btn">Login</button>
      </div>

      <form id="search-form" class="sidebar-form">

        <!-- Text Queries -->
        <section class="sidebar-section">
          <label class="section-label">🔍 Text Queries</label>
          <div id="query-inputs-container">
            <div class="search-row query-row" data-index="0">
              <input type="text" name="description_0" class="main-query-input"
                placeholder="Event 1 (e.g. Woman in purple)..." autocomplete="off">
            </div>
          </div>
          <button type="button" id="add-query-btn" class="btn btn-add">+ Add Event</button>
        </section>

        <!-- OCR Query -->
        <section class="sidebar-section">
          <label class="section-label">📝 OCR Filter</label>
          <input type="text" id="ocr-query-input" class="sidebar-input"
            placeholder="Text visible on screen..." autocomplete="off">
        </section>

        <!-- Audio/Transcript Query -->
        <section class="sidebar-section">
          <label class="section-label">🎙️ Audio Transcript Filter</label>
          <input type="text" id="audio-query-input" class="sidebar-input"
            placeholder="Spoken words in video..." autocomplete="off">
        </section>

        <!-- Search Options -->
        <section class="sidebar-section">
          <label class="section-label">⚙️ Options</label>

          <div class="option-row">
            <label class="option-label">Model(s)</label>
            <select id="models-select" multiple size="3" class="sidebar-select">
              <option value="all" selected>All</option>
            </select>
          </div>

          <div class="option-row">
            <label class="option-label">Score Threshold</label>
            <input type="number" id="score-threshold" value="0.3" step="0.05" min="0" max="1" class="sidebar-input-sm">
          </div>

          <div class="option-row">
            <label class="option-label">Result Limit</label>
            <input type="number" id="result-limit" value="100" min="1" max="10000" class="sidebar-input-sm">
          </div>
        </section>

        <!-- Object Detection Filter -->
        <section class="sidebar-section">
          <label class="section-label">📦 Object Filter</label>
          <div class="object-controls">
            <select id="object-select" class="sidebar-select-sm">
              <option value="person" selected>person</option>
              <option value="airplane">airplane</option>
              <option value="bag">bag</option>
              <option value="banana">banana</option>
              <option value="basket">basket</option>
              <option value="bench">bench</option>
              <option value="bicycle">bicycle</option>
              <option value="bird">bird</option>
              <option value="boat">boat</option>
              <option value="book">book</option>
              <option value="bowl">bowl</option>
              <option value="box">box</option>
              <option value="bridge">bridge</option>
              <option value="building">building</option>
              <option value="bus">bus</option>
              <option value="camera">camera</option>
              <option value="car">car</option>
              <option value="cat">cat</option>
              <option value="chair">chair</option>
              <option value="computer">computer</option>
              <option value="cow">cow</option>
              <option value="cup">cup</option>
              <option value="dog">dog</option>
              <option value="door">door</option>
              <option value="dress">dress</option>
              <option value="fence">fence</option>
              <option value="fish">fish</option>
              <option value="flower">flower</option>
              <option value="glasses">glasses</option>
              <option value="hat">hat</option>
              <option value="helmet">helmet</option>
              <option value="horse">horse</option>
              <option value="house">house</option>
              <option value="knife">knife</option>
              <option value="motorcycle">motorcycle</option>
              <option value="phone">phone</option>
              <option value="plate">plate</option>
              <option value="pot">pot</option>
              <option value="screen">screen</option>
              <option value="shirt">shirt</option>
              <option value="shoes">shoes</option>
              <option value="table">table</option>
              <option value="traffic light">traffic light</option>
              <option value="traffic sign">traffic sign</option>
              <option value="tree">tree</option>
              <option value="truck">truck</option>
              <option value="umbrella">umbrella</option>
              <option value="watch">watch</option>
            </select>
            <div class="object-nums">
              <input type="number" id="object-confidence" value="0.7" step="0.1" max="1" placeholder="Conf" class="sidebar-input-xs">
              <input type="number" id="object-min" value="1" min="1" placeholder="Min" class="sidebar-input-xs">
              <input type="number" id="object-max" value="" max="10000" placeholder="Max" class="sidebar-input-xs">
              <button type="button" id="add-object-btn" class="btn btn-obj-add">+</button>
            </div>
          </div>
          <div id="object-list" class="object-list"></div>
        </section>

        <!-- Search Button -->
        <button type="submit" id="search-btn" class="btn btn-search">🔎 Search</button>
      </form>
    </aside>

    <!-- ═══ RIGHT — Results Area ═══ -->
    <main class="results-area">
      <div class="results-header">
        <span id="results-count" class="results-count">Results: 0</span>
        <button type="button" id="toggle-group-shots-btn" class="btn btn-toggle-shots">Group Shots: OFF</button>
      </div>
      <div id="results-container">
        <p class="placeholder">Enter queries on the left panel and click Search.</p>
      </div>
    </main>

  </div>

  <button id="scroll-top-btn" title="Press Space to scroll top">▲</button>

  <!-- Video Modal -->
  <div id="video-modal" class="modal-overlay hidden">
    <div class="modal-content-wrapper">
      <div class="modal-player-section">
        <button id="close-modal-btn" class="close-btn">&times;</button>
        <h3 id="modal-video-title">Loading...</h3>
        <div class="video-player-wrapper">
          <video id="modal-video-player" width="100%" controls autoplay></video>
        </div>
      </div>

      <div class="modal-sidebar">
        <h4>Keyframes in Shot</h4>
        <div id="modal-shot-list" class="shot-list-container">
        </div>
      </div>
    </div>
  </div>

  <!-- Evaluation Modal -->
  <div id="evaluation-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 500px;">
      <h3>Select Evaluation</h3>
      <div id="evaluation-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
      <div style="text-align: right;">
        <button id="cancel-eval-btn"
          style="padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor:pointer;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', path='js/main.js') }}?v=3"></script>
</body>

</html>
